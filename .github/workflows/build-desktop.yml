name: Build Desktop Apps

on:
  push:
    paths:
      - '.github/workflows/build-desktop.yml'
      - 'dist/**'
  workflow_dispatch:

env:
  APP_VERSION: "2.4.0"

jobs:
  desktop:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone core source
        shell: pwsh
        run: |
          git config --local --unset http.https://github.com/.extraheader
          git clone https://${{ secrets.MATH_TUTOR_CORE_PAT }}@github.com/tangerserver/math-tutor-core.git core-src
          Copy-Item core-src\app.py .\
          Copy-Item core-src\core.py .\
          Copy-Item core-src\ui.html .\
          Copy-Item core-src\installer.nsi .\
          Copy-Item core-src\MathTutor.spec .\

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pywebview pyinstaller

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller MathTutor.spec

      - name: Build NSIS installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:Path += ";C:\Program Files (x86)\NSIS"
          }
          makensis installer.nsi
          Copy-Item dist\MathTutor-Setup.exe .\MathTutor-Setup.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mathtutor-desktop
          path: |
            MathTutor-Setup.exe
            dist\MathTutor.exe
