name: build-android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_USER_HOME=$HOME/.android" >> $GITHUB_ENV

      - name: Install npm deps (for capacitor-android)
        run: npm install --no-audit --no-fund

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MathTutor-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-android
          path: MathTutor-Android.apk
          if-no-files-found: error