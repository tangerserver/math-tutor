<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f23">
<link rel="manifest" href="manifest.json">
<title>數學解題練習</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f23;--card:#1a1a2e;--accent:#00d4ff;--accent2:#7c3aed;
--correct:#22c55e;--wrong:#ef4444;--text:#e2e8f0;--muted:#94a3b8;--radius:16px}
html,body{height:100%;font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
background:var(--bg);color:var(--text);overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding:12px 16px 80px}
.screen{display:none;animation:fadeUp .3s ease}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 4px rgba(0,212,255,.14)}50%{box-shadow:0 0 16px rgba(0,212,255,.38)}}
header{text-align:center;padding:24px 0 16px}
header h1{font-size:1.6rem;background:linear-gradient(135deg,var(--accent),var(--accent2));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--muted);font-size:.85rem;margin-top:4px}
.grade-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.grade-btn{
  background:var(--card);border:2px solid transparent;border-radius:var(--radius);
  padding:14px 4px;text-align:center;color:var(--text);font-size:.95rem;font-weight:600;
  cursor:pointer;transition:all .2s;position:relative;overflow:hidden;
  animation:glow 2.8s ease-in-out infinite}
.grade-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.grade-btn:hover{animation-duration:1.2s}
.grade-btn .cnt{display:block;font-size:.7rem;color:var(--muted);font-weight:400;margin-top:2px}
.topic-list{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.topic-btn{
  background:var(--card);border:1px solid #334155;border-radius:12px;
  padding:12px 16px;color:var(--text);font-size:.9rem;text-align:left;
  cursor:pointer;transition:all .2s;display:flex;justify-content:space-between;align-items:center;
  animation:glow 2.8s ease-in-out infinite}
.topic-btn:hover{border-color:var(--accent);background:#1e293b;animation-duration:1.2s}
.topic-btn .icon{font-size:1.2rem}
.q-card{
background:var(--card);border-radius:var(--radius);padding:24px 20px;
margin:12px 0;text-align:center;position:relative;overflow:hidden;
border:1px solid #334155;transition:border-color .3s}
.q-card.glow{border-color:var(--accent);box-shadow:0 0 30px rgba(0,212,255,.15)}
.q-card.pop{animation:bounce .4s ease}
.q-card.shake{animation:shake .4s ease}
.q-num{font-size:.75rem;color:var(--muted);margin-bottom:8px}
.q-text{font-size:1.25rem;font-weight:600;line-height:1.6;word-break:break-all}
.input-row{display:flex;gap:8px;margin:16px 0}
.input-row input{
flex:1;background:#0f172a;border:2px solid #334155;border-radius:12px;
padding:14px 16px;color:var(--text);font-size:1.1rem;text-align:center;
outline:none;transition:border-color .2s}
.input-row input:focus{border-color:var(--accent)}
.input-row input.correct{border-color:var(--correct);background:rgba(34,197,94,.08)}
.input-row input.wrong{border-color:var(--wrong);background:rgba(239,68,68,.08)}
.btn-row{display:flex;gap:8px;margin:8px 0}
.btn{
  flex:1;border:none;border-radius:12px;padding:14px;font-size:.95rem;font-weight:600;
  cursor:pointer;transition:all .15s;position:relative;overflow:hidden;
  animation:glow 2.8s ease-in-out infinite}
.btn:active{transform:scale(.96);animation-duration:.6s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-secondary{background:#1e293b;color:var(--text);border:1px solid #334155}
.btn-reveal{background:#334155;color:var(--muted)}
.score-bar{display:flex;justify-content:space-between;align-items:center;
background:var(--card);border-radius:12px;padding:10px 16px;margin:8px 0;font-size:.85rem}
.score-bar .correct{color:var(--correct)}
.score-bar .wrong{color:var(--wrong)}
.progress{height:4px;background:#1e293b;border-radius:2px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
border-radius:2px;transition:width .4s ease;width:0}
.toast{
position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
background:var(--card);border:1px solid var(--accent);border-radius:12px;
padding:12px 24px;color:var(--accent);font-size:.9rem;font-weight:500;
opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.correct{border-color:var(--correct);color:var(--correct)}
.toast.wrong{border-color:var(--wrong);color:var(--wrong)}
.reveal-box{
background:#1e293b;border:1px solid var(--accent);border-radius:12px;
padding:16px;margin:12px 0;text-align:center;font-size:1.1rem;color:var(--accent);
animation:pop .3s ease}
.reveal-box .label{font-size:.75rem;color:var(--muted);margin-bottom:4px}
canvas#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;opacity:.4}
.nav-bar{
position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:0;
background:rgba(15,15,35,.95);border-top:1px solid #1e293b;backdrop-filter:blur(10px);z-index:50}
.nav-btn{
flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;
padding:10px;color:var(--muted);font-size:.65rem;text-decoration:none;transition:color .2s}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px;margin-bottom:2px}
.mix-badge{
position:absolute;top:4px;right:6px;background:var(--accent2);
color:#fff;font-size:.55rem;padding:2px 6px;border-radius:6px;font-weight:700}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="app">
  <div id="home" class="screen active">
    <header>
      <h1>數學解題練習</h1>
      <p>小一 ~ 高三 · <span id="topicCount"></span> 種題型</p>
    </header>
    <div class="grade-grid" id="gradeGrid"></div>
  </div>
  <div id="topics" class="screen">
    <button class="btn btn-secondary" onclick="navHome()" style="margin-bottom:8px">← 返回年級</button>
    <h2 id="topicTitle" style="font-size:1.2rem;margin-bottom:8px"></h2>
    <div class="topic-list" id="topicList"></div>
  </div>
  <div id="quiz" class="screen">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <button class="btn btn-secondary" onclick="goBack()" style="padding:8px 12px;font-size:.8rem">← 返回</button>
      <span id="quizGrade" style="font-size:.75rem;color:var(--muted)"></span>
    </div>
    <div class="score-bar">
      <span>第 <span id="qIdx">1</span> 題</span>
      <span class="correct">✓ <span id="sc">0</span></span>
      <span class="wrong">✗ <span id="wa">0</span></span>
    </div>
    <div class="progress"><div class="progress-fill" id="prog"></div></div>
    <div class="q-card" id="qCard">
      <div class="q-num" id="qTopic"></div>
      <div class="q-text" id="qText"></div>
    </div>
    <div class="input-row">
      <input id="ansInput" type="text" inputmode="text" autocomplete="off"
        placeholder="輸入答案…" enterkeyhint="send">
    </div>
    <div id="revealArea"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="submitBtn" onclick="submitAns()">確認</button>
      <button class="btn btn-reveal" id="revealBtn" onclick="reveal()">看答案</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQ()" style="display:none">下一題 →</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<nav class="nav-bar" id="navBar">
  <a class="nav-btn active" onclick="navHome()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10"/></svg>
    首頁
  </a>
  <a class="nav-btn" onclick="randomQuiz()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    隨機練習
  </a>
</nav>
<script>class F{
constructor(n,d=1){if(d===0)throw 0;if(d<0){n=-n;d=-d;}
let g=F.gcd(Math.abs(n),d);this.n=n/g;this.d=d/g;}
static gcd(a,b){return b?F.gcd(b,a%b):a;}
static of(x){return x instanceof F?x:(typeof x==='string'?F.parse(x):new F(x,1));}
toString(){return this.d===1?''+this.n:this.n+'/'+this.d;}}
function decToFrac(s){let neg=false;if(s.startsWith('-')){neg=true;s=s.slice(1);}
let[i,f]=s.includes('.')?s.split('.'):[s||'0',''];let den=Math.pow(10,f.length);
let num=+(i||'0')*den+(+f||0);return new F(neg?-num:num,den);}
F.parse=function(s){if(s instanceof F)return s;if(typeof s!=='string')s=String(s);
s=s.trim();if(s.includes('/')){let p=s.split('/');return new F(+p[0],+p[1]);}
if(s.includes('.'))return decToFrac(s);return new F(+s,1);};
const FW={};for(let i=0;i<10;i++)FW[String.fromCharCode(0xFF10+i)]=String(i);
FW['\uFF0C']=',';FW['\uFF1B']=';';FW['\uFF0F']='/';FW['\uFF0D']='-';
FW['\u2212']='-';FW['\uFE63']='-';FW['\u3000']='';FW['\uFF05']='';FW['\uFF08']='(';FW['\uFF09']=')';
function norm(s){return[...String(s)].map(c=>FW[c]??c).join('').trim().replace(/ /g,'');}
function check(u,a){u=norm(u);a=norm(a);if(u===a)return true;
try{if(a.indexOf(';')>=0||u.indexOf(';')>=0){
let pl=s=>s.split(';').filter(Boolean).map(x=>F.parse(x));
return pl(u).length===pl(a).length&&pl(u).every((x,i)=>x.n===pl(a)[i].n&&x.d===pl(a)[i].d);}
if(a.indexOf(',')>=0||u.indexOf(',')>=0){
let pl=s=>s.replace('[','').replace(']','').split(',').filter(x=>String(x).trim()!=='').map(x=>F.parse(x.replace(';',',')));
let lu=pl(u),la=pl(a);
return lu.length===la.length&&lu.every((x,i)=>x.n===la[i].n&&x.d===la[i].d);}
return F.parse(u).n===F.parse(a).n&&F.parse(u).d===F.parse(a).d;
}catch(e){return false;}}
const R={randint:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
choice:a=>a[Math.floor(Math.random()*a.length)]};
function fmt(v){let f=F.of(v);return f.d===1?''+f.n:f.toString();}
function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
const G={};function add(g,n,fn){(G[g]||(G[g]=[])).push([n,fn]);}

add('小一','二位數加法',()=>{let a=R.randint(11,98),b=R.randint(1,a-1);return[a+' + '+b+' = ?',String(a+b)];});
add('小一','二位數減法',()=>{let a=R.randint(11,98),ones=a%10,b;
if(ones>=2&&ones<=8)b=R.randint(ones+1,9);else{a=R.randint(18,98);b=R.randint(1,a-1);}
return[a+' - '+b+' = ?',String(a-b)];});
add('小一','乘法進位',()=>{let a=R.randint(2,9),b=R.randint(2,9),c=R.randint(2,9),d=R.randint(2,9);
return[a+'×'+b+' + '+c+'×'+d+' = ?',String(a*b+c*d)];});
add('小一','乘加混合',()=>{let a=R.randint(2,9),b=R.randint(2,9),c=R.randint(2,9);
return[a+'×'+b+' + '+c+' = ?',String(a*b+c)];});
add('小一','乘減混合',()=>{let a=R.randint(2,9),b=R.randint(2,9),c=R.randint(2,9);
return[a+'×'+b+' - '+c+' = ?',String(a*b-c)];});
add('小一','十以內加減',()=>{if(Math.random()<0.5){let a=R.randint(1,8),b=R.randint(1,10-a);
return[a+' + '+b+' = ?',String(a+b)];}let b=R.randint(1,9),a=R.randint(b+1,10);
return[a+' - '+b+' = ?',String(a-b)];});
add('小一','應用題',()=>{let b=R.randint(2,6),a=R.randint(7,10);
return['水果攤有 '+b+' 顆蘋果，媽媽又買了 '+a+' 顆，一共有幾顆？',String(a+b)];});
add('小一','整十加減',()=>{let t=[10,20,30,40,50,60,70,80,90];
if(Math.random()<0.5){let a=R.choice([10,20,30,40,50]),b=R.choice(t.filter(x=>x<=100-a));
return[a+' + '+b+' = ?',String(a+b)];}let a=R.choice([20,30,40,50,60,70,80,90]),
b=R.choice(t.filter(x=>x<a));return[a+' - '+b+' = ?',String(a-b)];});

add('小二','乘法算式',()=>{let a=R.randint(2,9),b=R.randint(2,9),c=R.randint(2,9);
return[a+'×'+b+' × '+c+' = ?',String(a*b*c)];});
add('小二','乘數求法',()=>{let b=R.randint(2,9),q=R.randint(2,9);
return[b+' × □ = '+b*q+'，□ ＝ ?',String(q)];});
add('小二','九九乘法',()=>{let v=R.choice([7,8,9]),d=R.randint(2,9);
return['九九乘法：'+['七','八','九'][v-7]+'×'+d+' = ?',String(v*d)];});
add('小二','數的組成',()=>{let a=R.randint(20,98);
return[String(a)+' = '+Math.floor(a/10)+'個十＋'+(a%10)+'個一，□個十＋□個一？',Math.floor(a/10)+'個十＋'+(a%10)+'個一'];});
add('小二','購物問題',()=>{let c=R.randint(3,18)*50;
return['甲有 '+c+' 元，乙有 '+(c+200)+' 元，共幾元？',String(2*c+200)];});
add('小二','時間換算',()=>{let h=R.choice([1,2,3,5,6]);return[h+' 小時 = 幾分鐘？',String(h*60)];});
add('小二','裝箱問題',()=>{let a=R.randint(2,9),f=R.randint(3,9);
return[a*f+' 顆糖果，每'+a+'顆一裝，可裝幾袋？',String(f)];});
add('小二','應用題',()=>{let k=R.randint(2,6),m=R.randint(2,5);
return['把 '+k*m+' 顆糖果平分給 '+m+' 位小朋友，每人幾顆？',String(k)];});

add('小三','周長問題',()=>{let a=R.randint(3,9),b=R.randint(2,6);
return['長方形長 '+a+'、寬 '+b+'，周長 = ?',String(2*(a+b))];});
add('小三','因數倍數',()=>{let a=R.randint(2,9),b=R.randint(2,9);
return[a+'×'+b+' = '+a*b+' = □×'+a+' ＝ □×'+b,String(a)+' 或 '+String(b)];});
add('小三','倒數',()=>{let n=R.randint(1,3),d=R.randint(2,9);
return['分數 '+n+'/'+d+' 的倒數 = ?',fmt(new F(d,n))];});
add('小三','整十除法',()=>{let a=R.randint(10,30)*10;return[String(a)+'÷10 = ?',String(a/10)];});
add('小三','圓周長',()=>{let r=R.randint(3,12);
return['圓形半徑 '+r+',周長（3.14） = ?',String(Math.round(3.14*2*r*10)/10)];});
add('小三','帶分數化假分數',()=>{let w=R.randint(2,5),d=R.choice([3,4,5,6]),n=R.randint(1,d-1);
return['帶分數 '+w+' 又 '+n+'/'+d+' 化成假分數 = ?',(w*d+n)+'/'+d];});
add('小三','應用題',()=>{let p=R.randint(6,24),n=R.randint(2,4);
return['一枝筆 '+p+' 元，買 '+n+' 枝給 100 元，找回多少？',String(100-p*n)];});

add('小四','裝盒問題',()=>{let q=R.randint(10,49),d=R.randint(2,9);
return[q*d+' 顆糖裝成每盒 '+d+' 顆，可裝幾盒？',String(q)];});
add('小四','整數大小',()=>{let a=R.randint(10,99),b=R.randint(10,99);
return['比 '+a+' 大的最小整數 + '+b+' = ?',String(a+1+b)];});
add('小四','時間加法',()=>{let h=R.randint(2,5),m=R.randint(1,5)*10;
return[h+'時'+String(m).padStart(2,'0')+'分 ＋ 30分 = 共幾分鐘？',String(h*60+m+30)];});
add('小四','次方計算',()=>{let a=R.randint(2,9),k=R.randint(2,5);
return[String(a)+' 的 '+k+' 次方 = ?',String(Math.pow(a,k))];});
add('小四','長方面積',()=>{let a=R.randint(20,49),b=R.randint(5,19);
return['長方形長 '+a+' 寬 '+b+'，面積 = ?平方公分',String(a*b)];});
add('小四','四則混合',()=>{let a=R.randint(2,9),b=R.randint(2,9),c=R.randint(2,9);
return[a+' + '+b+' × '+c+' = ?',String(a+b*c)];});
add('小四','分配律簡算',()=>{let a=R.randint(2,9),b=R.randint(2,9),c=R.randint(2,9);
return['用分配律：'+a+'×'+b+' + '+a+'×'+c+' = ?',String(a*(b+c))];});
add('小四','應用題',()=>{let v=R.choice([45,60,75,80,90]),t=R.randint(2,5);
return['巴士時速'+v+'公里行駛'+t+'小時，共多少公里？',String(v*t)];});

add('小五','分數倒數',()=>{let n=R.randint(2,8),d=n+R.randint(1,5);
return['分數 '+n+'/'+d+' 的倒數 = ?',fmt(new F(d,n))];});
add('小五','分數加法',()=>{let n1=R.randint(1,4),d1=R.randint(5,9),n2=R.randint(1,4);
return[n1+'/'+d1+' + '+n2+'/'+d1+' = ?',fmt(new F(n1+n2,d1))];});
add('小五','分數減法',()=>{let n1=R.randint(2,8),d1=9,n2=R.randint(1,n1-1);
return[n1+'/'+d1+' - '+n2+'/'+d1+' = ?',fmt(new F(n1-n2,d1))];});
add('小五','小數化分數',()=>{let p=R.choice([[3,4],[1,2],[1,5],[3,5],[1,4],[2,5]]);
return[String(p[0]/p[1])+' 化成最簡分數 = ?',fmt(new F(p[0],p[1]))];});
add('小五','長方體體積',()=>{let a=R.randint(2,9),b=R.randint(2,9),c=R.randint(2,9);
return['長方體長'+a+'寬'+b+'高'+c+'，體積 = ?立方公分',String(a*b*c)];});
add('小五','分數化小數',()=>{let p=R.choice([[1,2],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,8],[1,10],[7,10]]);
return['分數 '+p[0]+'/'+p[1]+' 化成小數 = ?',fmt(new F(p[0],p[1]))];});
add('小五','質數判斷',()=>{let n=R.randint(2,29),ok=true;
for(let i=2;i*i<=n;i++)if(n%i===0){ok=false;break;}
return[String(n)+' 是質數嗎？（回答「是」或「否」）',ok?'是':'否'];});
add('小五','應用題',()=>{let p=R.choice([40,50,60,80,120,150]),d=R.choice([['八',8],['五',5],['九',9]]);
return['原價'+p+'元打'+d[0]+'折，特價多少元？',String(p*d[1]/10)];});

add('小六','百分率',()=>{let n=R.randint(1,4),d=R.randint(2,9);
return['分數 '+n+'/'+d+' 用百分率表示 = ?%',String(Math.round(n/d*100))];});

return['二次方程 '+a+'x²+('+b+')x+('+c+')=0，判別式 b²-4ac = ?',String(b*b-4*a*c)];});

function getTopics(g){return G[g]||[];}
function randomQ(g){let ts=getTopics(g);if(!ts.length)return['',''];return R.choice(ts)[1]();}

if(typeof process!=='undefined'&&typeof require!=='undefined'){
let bad=0,total=0;
for(let g in G){G[g].forEach(function(p){let n=p[0],fn=p[1];
for(let i=0;i<150;i++){let qa=fn();
if(!qa||!qa[0]||!qa[1]){bad++;console.log('EMPTY',g,n,qa);}
else if(!check(qa[1],qa[1])){bad++;console.log('FAIL',g,n,qa);}else total++;}});}
console.log('topics:',Object.keys(G).reduce(function(s,v){return s+G[v].length;},0),
'checks:',total,'bad:',bad);}</script>
<script>
if('serviceWorker' in navigator && location.protocol !== 'file:' && !window.Capacitor){
  navigator.serviceWorker.register('sw.js').then(reg=>reg.update()).catch(()=>{});
}

const GRADES=['小一','小二','小三','小四','小五','小六','國一','國二','國三','高一','高二','高三'];
const gradeGrid=document.getElementById('gradeGrid');
const gradeCounts={};
GRADES.forEach(g=>{gradeCounts[g]=(G[g]||[]).length;});
document.getElementById('topicCount').textContent=GRADES.reduce((s,g)=>s+gradeCounts[g],0);

GRADES.forEach(g=>{
  const b=document.createElement('button');
  b.className='grade-btn';
  b.innerHTML=g+'<span class="cnt">'+gradeCounts[g]+' 題型</span>';
  b.onclick=()=>location.hash='#/topics/'+encodeURIComponent(g);
  gradeGrid.appendChild(b);
});
const mb=document.createElement('button');
mb.className='grade-btn';
mb.innerHTML='隨機<span class="cnt">全題型隨機</span><span class="mix-badge">MIX</span>';
mb.style.borderColor='var(--accent2)';
mb.onclick=()=>randomQuiz();
gradeGrid.appendChild(mb);

let currentGrade='',currentTopic='',total=0,correct=0,wrong=0,answered=false;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(id==='home')document.querySelectorAll('.nav-btn')[0].classList.add('active');
}

function navHome(){location.hash='#/';}
function randomQuiz(){location.hash='#/quiz/隨機';}

function route(){
  const h=decodeURIComponent(location.hash)||'#/';
  if(h.startsWith('#/quiz/')){
    const parts=h.slice(7).split('/');
    const g=parts[0],t=parts[1]||'';
    if(g==='隨機'){currentGrade='隨機';currentTopic='';}
    else if(!(G[g]||[]).length||(t&&!getTopics(g).some(x=>x[0]===t))){showHome();return;}
    else{currentGrade=g;currentTopic=t;}
    showScreen('quiz');updateScore();nextQ();
  }else if(h.startsWith('#/topics/')){
    const g=h.slice(9);
    if(!(G[g]||[]).length){showHome();return;}
    showTopics(g);
  }else showHome();
}
function showHome(){showScreen('home');}
function showTopics(g){
  currentGrade=g;
  showScreen('topics');
  document.getElementById('topicTitle').textContent=g+' — 選擇題型';
  const list=document.getElementById('topicList');
  list.innerHTML='';
  const ts=getTopics(g);
  ts.forEach(([name])=>{
    const b=document.createElement('button');
    b.className='topic-btn';
    b.innerHTML='<span>'+name+'</span><span class="icon">→</span>';
    b.onclick=()=>location.hash='#/quiz/'+encodeURIComponent(currentGrade)+'/'+encodeURIComponent(name);
    list.appendChild(b);
  });
}

function getQ(){
  if(currentGrade==='隨機')return randomQ(R.choice(GRADES));
  const ts=getTopics(currentGrade);
  const t=ts.find(x=>x[0]===currentTopic);
  return t?t[1]():['',''];
}

function nextQ(){
  answered=false;
  const[question,answer]=getQ();
  document.getElementById('qText').textContent=question;
  document.getElementById('qText').__ans=answer;
  document.getElementById('qTopic').textContent=(currentGrade==='隨機'?'隨機':currentGrade)+(currentTopic?' · '+currentTopic:'');
  document.getElementById('ansInput').value='';
  document.getElementById('ansInput').className='';
  document.getElementById('ansInput').disabled=false;
  document.getElementById('ansInput').focus();
  document.getElementById('revealArea').innerHTML='';
  document.getElementById('submitBtn').style.display='';
  document.getElementById('revealBtn').style.display='';
  document.getElementById('nextBtn').style.display='none';
  const card=document.getElementById('qCard');
  card.className='q-card glow';
  setTimeout(()=>card.className='q-card',500);
  total++;updateScore();
}

function submitAns(){
  if(answered)return;
  const u=document.getElementById('ansInput').value.trim();
  if(!u)return;
  const card=document.getElementById('qCard');
  if(check(u,document.getElementById('qText').__ans)){
    correct++;answered=true;
    document.getElementById('ansInput').className='correct';
    card.className='q-card pop';
    toast('✓ 答對了！','correct');
  }else{
    wrong++;answered=true;
    document.getElementById('ansInput').className='wrong';
    card.className='q-card shake';
    toast('✗ 再想想','wrong');
  }
  updateScore();
  document.getElementById('submitBtn').style.display='none';
  document.getElementById('revealBtn').style.display='none';
  document.getElementById('nextBtn').style.display='';
}

function reveal(){
  const a=document.getElementById('qText').__ans;
  document.getElementById('revealArea').innerHTML=
    '<div class="reveal-box"><div class="label">正確答案</div>'+a+'</div>';
  answered=true;wrong++;updateScore();
  document.getElementById('submitBtn').style.display='none';
  document.getElementById('revealBtn').style.display='none';
  document.getElementById('nextBtn').style.display='';
}

document.getElementById('ansInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();if(answered)nextQ();else submitAns();}
});

function goBack(){
  const h=location.hash;
  if(h.startsWith('#/quiz/')){
    if(currentGrade==='隨機')location.hash='#/';
    else location.hash='#/topics/'+encodeURIComponent(currentGrade);
  }else if(h.startsWith('#/topics/'))location.hash='#/';
  else location.hash='#/';
}
window.addEventListener('hashchange',route);
if(!location.hash)history.replaceState(null,'','#/');
route();

function updateScore(){
  document.getElementById('qIdx').textContent=total;
  document.getElementById('sc').textContent=correct;
  document.getElementById('wa').textContent=wrong;
  const pct=total>0?correct/total*100:0;
  document.getElementById('prog').style.width=Math.round(pct)+'%';
  document.getElementById('quizGrade').textContent=(currentGrade==='隨機'?'隨機模式':currentGrade)+(currentTopic?' · '+currentTopic:'');
}

function toast(msg,cls){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+(cls||'')+' show';
  setTimeout(()=>t.className='toast',1500);
}

(function(){
  const c=document.getElementById('particles'),ctx=c.getContext('2d');
  let W,H,pts=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<40;i++)pts.push({x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*2+.5});
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;
      if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(0,212,255,.3)';ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
